# Local dev overlay: publish the ZITADEL API directly, mint an admin PAT for the
# branding seed, and point Login V2 at the Next.js dev server on :3000.
services:
  zitadel-api:
    ports:
      - "8080:8080"
    environment:
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:3000/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:3000/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:3000/ui/v2/login/logout?post_logout_redirect=
      # The TOTP issuer is a SERVER default, not an instance setting and not the
      # instance name: it is baked into each enrolment QR and cannot be changed
      # for codes already enrolled. Keep this identical to production.
      ZITADEL_SYSTEMDEFAULTS_MULTIFACTORS_OTP_ISSUER: Venho.AI
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: venho-admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Venho local admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      # A device code is valid for 5 minutes by default, and the whole sign-up
      # now happens inside that window: enter the code, create the account,
      # verify the email, then consent. Five minutes is not enough for someone
      # switching to their mail, and the code expiring mid-flow looks like a
      # broken product. Deployed instances need this too — see VENHO.md.
      ZITADEL_OIDC_DEVICEAUTH_LIFETIME: 15m
      # Mail delivery to the Mailpit catcher below, seeded AT INSTANCE CREATION
      # (setupSMTPSettings adds AND activates it — internal/command/instance.go).
      # Email verification is mandatory on every sign-up path, so without this a
      # fresh stack cannot complete a sign-up. These vars only act on first boot;
      # for a database that already exists, run ../venho/seed-smtp.sh once.
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: zitadel-mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@venho.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Venho
    depends_on:
      mailpit:
        condition: service_started

  # Local SMTP catcher. Email verification is mandatory on every sign-up path
  # (see VENHO.md), so an instance with no mail delivery cannot complete a
  # sign-up: SendEmailCode succeeds at the API, then the notification handler
  # dies with "could not create email channel … SMTPConfig.NotFound" and the
  # user waits on /verify for a mail that never comes. Mailpit receives
  # everything at zitadel-mailpit:1025 and shows it at http://localhost:8025.
  #
  # The instance does NOT pick this up by itself — SMTP provider config lives
  # in the database, and ZITADEL_DEFAULTINSTANCE_* only applies at instance
  # creation. Run ../venho/seed-smtp.sh once after first boot (idempotent).
  mailpit:
    image: axllent/mailpit:v1.31.0
    container_name: zitadel-mailpit # the seeded provider host is pinned to this name
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # web UI + API
      - "127.0.0.1:1025:1025" # SMTP, for anything else running on the host
    networks:
      - zitadel

# NOTE: this overlay deliberately does NOT start `zitadel-login`. The login app
# runs from source on :3000 (`pnpm --filter @zitadel/login dev`) so changes are
# visible without rebuilding an image, which is why the Login V2 base URI above
# points at :3000 rather than at the proxy.
