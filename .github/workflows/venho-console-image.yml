name: Publish Venho Console Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Defaults to the commit SHA."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/venhoai/venho-zitadel-console

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:$tag" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Management Console
        env:
          NX_DAEMON: "false"
          NX_DISABLE_DB: "true"
          NX_NO_CLOUD: "true"
        run: pnpm nx run @zitadel/console:build --skip-nx-cache --verbose

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -f console/Dockerfile -t "${{ steps.image.outputs.image }}" console

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"
